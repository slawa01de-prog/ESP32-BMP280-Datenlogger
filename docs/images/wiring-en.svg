<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050">
<rect width="1200" height="1050" fill="#f5f7fb"/>
<style>text{font-family:Arial,sans-serif;fill:#17283c} .title{font-size:30px;font-weight:bold}.sub{font-size:18px;fill:#46576a}.head{font-size:23px;font-weight:bold}.pin{font-size:20px}.wire{fill:none;stroke-width:3}</style>
<text x="45" y="55" class="title">ESP32-C3 · Data logger wiring</text>
<text x="45" y="88" class="sub">Firmware V7.4.3 · connections by signal name, not physical pin order</text>
<rect x="45" y="125" width="1110" height="545" rx="16" fill="white" stroke="#ccd6e2"/>
<text x="75" y="167" class="head">A · OLED + EC11 encoder + two buttons on one PCB</text>
<rect x="85" y="193" width="265" height="440" rx="12" fill="#e9f0f8"/>
<rect x="770" y="193" width="345" height="440" rx="12" fill="#e0f3f1"/>
<text x="108" y="229" class="head">ESP32-C3</text><text x="790" y="229" class="head">OLED / encoder module</text>
<text x="110" y="277" class="pin">3V3</text><path d="M350 270 H770" class="wire" stroke="#c53a38"/><circle cx="350" cy="270" r="4" fill="#c53a38"/><circle cx="770" cy="270" r="4" fill="#c53a38"/><text x="790" y="277" class="pin">VCC</text><text x="110" y="316" class="pin">GND</text><path d="M350 309 H770" class="wire" stroke="#283848"/><circle cx="350" cy="309" r="4" fill="#283848"/><circle cx="770" cy="309" r="4" fill="#283848"/><text x="790" y="316" class="pin">GND</text><text x="110" y="355" class="pin">GPIO8</text><path d="M350 348 H770" class="wire" stroke="#217958"/><circle cx="350" cy="348" r="4" fill="#217958"/><circle cx="770" cy="348" r="4" fill="#217958"/><text x="790" y="355" class="pin">SDA</text><text x="110" y="394" class="pin">GPIO9</text><path d="M350 387 H770" class="wire" stroke="#2764b0"/><circle cx="350" cy="387" r="4" fill="#2764b0"/><circle cx="770" cy="387" r="4" fill="#2764b0"/><text x="790" y="394" class="pin">SCL</text><text x="110" y="433" class="pin">GPIO0</text><path d="M350 426 H770" class="wire" stroke="#8e4b9d"/><circle cx="350" cy="426" r="4" fill="#8e4b9d"/><circle cx="770" cy="426" r="4" fill="#8e4b9d"/><text x="790" y="433" class="pin">TRA (Encoder A)</text><text x="110" y="472" class="pin">GPIO1</text><path d="M350 465 H770" class="wire" stroke="#8e4b9d"/><circle cx="350" cy="465" r="4" fill="#8e4b9d"/><circle cx="770" cy="465" r="4" fill="#8e4b9d"/><text x="790" y="472" class="pin">TRB (Encoder B)</text><text x="110" y="511" class="pin">GPIO3</text><path d="M350 504 H770" class="wire" stroke="#b66b16"/><circle cx="350" cy="504" r="4" fill="#b66b16"/><circle cx="770" cy="504" r="4" fill="#b66b16"/><text x="790" y="511" class="pin">PUSH (encoder push)</text><text x="110" y="550" class="pin">GPIO4</text><path d="M350 543 H770" class="wire" stroke="#b66b16"/><circle cx="350" cy="543" r="4" fill="#b66b16"/><circle cx="770" cy="543" r="4" fill="#b66b16"/><text x="790" y="550" class="pin">BAK (button)</text><text x="110" y="589" class="pin">GPIO5</text><path d="M350 582 H770" class="wire" stroke="#b66b16"/><circle cx="350" cy="582" r="4" fill="#b66b16"/><circle cx="770" cy="582" r="4" fill="#b66b16"/><text x="790" y="589" class="pin">CONTR (button)</text>
<rect x="45" y="695" width="1110" height="250" rx="16" fill="white" stroke="#ccd6e2"/>
<text x="75" y="735" class="head">B · Connect BMP280 to the same ESP32-C3</text>
<text x="110" y="785" class="pin">3V3</text><path d="M350 778 H770" class="wire" stroke="#c53a38"/><text x="790" y="785" class="pin">VCC / 3.3 V supply</text><text x="110" y="825" class="pin">GND</text><path d="M350 818 H770" class="wire" stroke="#283848"/><text x="790" y="825" class="pin">GND</text><text x="110" y="865" class="pin">GPIO8 / SDA</text><path d="M350 858 H770" class="wire" stroke="#217958"/><text x="790" y="865" class="pin">SDA</text><text x="110" y="905" class="pin">GPIO9 / SCL</text><path d="M350 898 H770" class="wire" stroke="#2764b0"/><text x="790" y="905" class="pin">SCL</text>
<text x="45" y="981" class="sub">OLED: 0x3C · BMP280: 0x76 · parallel I²C bus · supply and logic: 3.3 V</text>
<text x="45" y="1013" class="sub">Power the ESP32 board via USB. Check module signal names; see docs/en/HARDWARE.md.</text>
</svg>